# Pull images from Docker Hub (set DOCKERHUB_USERNAME in .env).
# Build & push: tag as ${DOCKERHUB_USERNAME}/dis-connect-frontend:latest (and -go, -python).

services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/dis-connect-frontend:latest
    container_name: dis-connect-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - go-service

  go-service:
    image: ${DOCKERHUB_USERNAME}/dis-connect-go:latest
    container_name: dis-connect-go-service
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
      - redis
      - python-service
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dis_connect?sslmode=disable
      - REDIS_ADDR=redis:6379
      - AGENT_BASE_URL=http://python-service:8000
      - FIREBASE_CREDENTIALS_PATH=/app/secret/firebase-service-account.json
    volumes:
      - ./go-service/secret:/app/secret:ro

  python-service:
    image: ${DOCKERHUB_USERNAME}/dis-connect-python:latest
    container_name: dis-connect-python-service
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379

  postgres:
    image: postgres:16-alpine
    container_name: dis-connect-postgres
    environment:
      - POSTGRES_DB=dis_connect
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dis-connect-redis
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  postgres_data:
