name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  # ── Detect which services changed ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      go:       ${{ steps.filter.outputs.go }}
      python:   ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
            go:
              - 'go-service/**'
              - 'docker-compose.yml'
              - '.env.example'
            python:
              - 'python-service/**'
              - 'docker-compose.yml'
              - '.env.example'

  # ── Build & push frontend ─────────────────────────────────────────────────────
  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dis-connect-frontend:latest
          # VITE_ vars are baked into the JS bundle at build time — must come from secrets
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Build & push go-service ───────────────────────────────────────────────────
  build-go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push go-service
        uses: docker/build-push-action@v6
        with:
          context: ./go-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dis-connect-go:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Build & push python-service ───────────────────────────────────────────────
  build-python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push python-service
        uses: docker/build-push-action@v6
        with:
          context: ./python-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dis-connect-python:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to VM (only if at least one image was rebuilt) ─────────────────────
  deploy:
    needs: [build-frontend, build-go, build-python]
    # always() lets this job run even when sibling jobs were skipped,
    # but we bail out if any ran and actually failed
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      (
        needs.build-frontend.result == 'success' ||
        needs.build-go.result       == 'success' ||
        needs.build-python.result   == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/dis-connect
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
